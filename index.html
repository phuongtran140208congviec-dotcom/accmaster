<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AccMaster - Luyện Tập Định Khoản Kế Toán Tương Tác</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap');
    body { font-family: 'Be Vietnam Pro', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <!-- Thanh Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow">
          A
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-tight">AccMaster</h1>
          <p class="text-xs text-slate-500 font-medium">Hệ thống Luyện tập Định khoản Tương tác Số</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
          Chế độ Tự học
        </span>
      </div>
    </div>
  </header>

  <!-- Khung nội dung chính -->
  <main class="max-w-4xl mx-auto px-4 py-6">
    <!-- Thẻ Đề bài -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
      <div class="bg-slate-900 px-6 py-3 flex items-center justify-between text-white">
        <div class="flex items-center space-x-2">
          <span class="px-2 py-0.5 rounded text-xs font-semibold bg-indigo-500 uppercase" id="badgeCategory">Mua hàng & Công nợ</span>
          <span class="text-slate-400 text-xs" id="qCounter">Nghiệp vụ 1 / 3</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="fillSample(true)" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1 rounded font-medium transition">
            Điền Đúng
          </button>
          <button onclick="fillSample(false)" class="text-xs bg-rose-600 hover:bg-rose-500 px-2.5 py-1 rounded font-medium transition">
            Điền Sai
          </button>
        </div>
      </div>
      <div class="p-6">
        <h2 class="text-base font-semibold text-slate-900 mb-1">Nghiệp vụ phát sinh:</h2>
        <p class="text-slate-700 text-lg leading-relaxed font-medium bg-slate-50 p-4 rounded-lg border border-slate-100" id="scenarioText">
          Đang tải dữ liệu nghiệp vụ...
        </p>
      </div>
    </div>

    <!-- Khu vực nhập liệu Định khoản -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
        <h3 class="font-bold text-slate-800 flex items-center">
          <i data-lucide="edit-3" class="w-4 h-4 mr-2 text-indigo-600"></i>
          Thực hiện Định khoản
        </h3>
        <button onclick="addEntryRow()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 flex items-center bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">
          <i data-lucide="plus" class="w-3.5 h-3.5 mr-1"></i> Thêm dòng Nợ/Có
        </button>
      </div>

      <div class="space-y-3" id="entriesContainer">
        <!-- Các dòng Nợ Có sẽ được render động ở đây -->
      </div>

      <!-- Tổng tiền Nợ - Có kiểm tra đối ứng -->
      <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center text-sm font-semibold text-slate-600 px-1">
        <div class="space-x-4">
          <span>Tổng Nợ: <b id="sumDebit" class="text-slate-900 font-mono">0 đ</b></span>
          <span>Tổng Có: <b id="sumCredit" class="text-slate-900 font-mono">0 đ</b></span>
        </div>
        <div id="balanceStatus" class="text-xs font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-500">
          Chưa cân bằng Nợ - Có
        </div>
      </div>

      <div class="mt-6 flex space-x-3">
        <button onclick="checkAnswer()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow transition flex items-center justify-center">
          <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i> Kiểm tra kết quả
        </button>
        <button onclick="nextQuestion()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-5 py-3 rounded-lg transition flex items-center justify-center">
          Kế tiếp <i data-lucide="arrow-right" class="w-4 h-4 ml-2"></i>
        </button>
      </div>
    </div>

    <!-- Khu vực Hiển thị Phản hồi & Sơ đồ chữ T -->
    <div id="feedbackSection" class="hidden bg-white rounded-xl shadow-sm border p-6 mb-8 transition-all">
      <div id="feedbackHeader" class="flex items-center space-x-3 mb-4 p-3 rounded-lg">
        <!-- Icon & Lời nhận xét -->
      </div>

      <div class="mb-4">
        <h4 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-1">Phân tích nguyên lý:</h4>
        <p id="analysisText" class="text-slate-700 text-sm leading-relaxed"></p>
      </div>

      <!-- Sơ đồ chữ T trực quan -->
      <div>
        <h4 class="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">Minh họa Sơ đồ chữ T:</h4>
        <div id="tAccountsContainer" class="flex flex-wrap gap-4 items-center justify-center bg-slate-50 p-4 rounded-xl border border-slate-200">
          <!-- Các thẻ chữ T sẽ tự tạo ở đây -->
        </div>
      </div>
    </div>
  </main>

  <script>
    // 1. Từ điển Hệ thống Tài khoản kế toán TT200 / TT133
    const ACCOUNT_CHART = {
      "111": "Tiền mặt",
      "112": "Tiền gửi ngân hàng",
      "131": "Phải thu của khách hàng",
      "1331": "Thuế GTGT được khấu trừ của HHHV",
      "141": "Tạm ứng",
      "152": "Nguyên liệu, vật liệu",
      "153": "Công cụ, dụng cụ",
      "156": "Hàng hóa",
      "211": "Tài sản cố định hữu hình",
      "331": "Phải trả cho người bán",
      "334": "Phải trả người lao động",
      "338": "Phải trả, phải nộp khác",
      "511": "Doanh thu bán hàng & CCDV",
      "621": "Chi phí NVL trực tiếp",
      "622": "Chi phí NCTT",
      "627": "Chi phí SX chung",
      "632": "Giá vốn hàng bán",
      "641": "Chi phí bán hàng",
      "642": "Chi phí QLDN",
      "911": "Xác định kết quả kinh doanh"
    };

    // 2. Ngân hàng nghiệp vụ mẫu
    const QUESTIONS = [
      {
        id: 1,
        category: "Mua hàng & Công nợ",
        scenario: "Mua nguyên vật liệu nhập kho, giá chưa thuế GTGT 20.000.000 đ, thuế GTGT 10%, chưa thanh toán tiền cho Công ty X.",
        sampleCorrect: [
          { side: "No", account: "152", amount: 20000000 },
          { side: "No", account: "1331", amount: 2000000 },
          { side: "Co", account: "331", amount: 22000000 }
        ],
        sampleWrong: [
          { side: "No", account: "152", amount: 22000000 },
          { side: "Co", account: "112", amount: 22000000 }
        ],
        correctEntries: [
          { side: "No", account: "152", amount: 20000000 },
          { side: "No", account: "1331", amount: 2000000 },
          { side: "Co", account: "331", amount: 22000000 }
        ],
        analysis: "1. Nguyên vật liệu nhập kho làm Tài sản tăng: Ghi Nợ TK 152 (20.000.000 đ).<br>2. Thuế GTGT đầu vào được khấu trừ làm Tài sản tăng: Ghi Nợ TK 1331 (2.000.000 đ).<br>3. Chưa thanh toán cho người bán làm Nợ phải trả tăng: Ghi Có TK 331 (22.000.000 đ).",
        tAccounts: [
          { code: "152", name: "Nguyên liệu, vật liệu", debit: 20000000, credit: 0 },
          { code: "1331", name: "Thuế GTGT khấu trừ", debit: 2000000, credit: 0 },
          { code: "331", name: "Phải trả người bán", debit: 0, credit: 22000000 }
        ]
      },
      {
        id: 2,
        category: "Vốn bằng tiền",
        scenario: "Rút tiền gửi ngân hàng về nhập quỹ tiền mặt tại doanh nghiệp, số tiền 15.000.000 đ.",
        sampleCorrect: [
          { side: "No", account: "111", amount: 15000000 },
          { side: "Co", account: "112", amount: 15000000 }
        ],
        sampleWrong: [
          { side: "No", account: "112", amount: 15000000 },
          { side: "Co", account: "111", amount: 15000000 }
        ],
        correctEntries: [
          { side: "No", account: "111", amount: 15000000 },
          { side: "Co", account: "112", amount: 15000000 }
        ],
        analysis: "1. Tiền mặt tại quỹ tăng (Tài sản tăng): Ghi Nợ TK 111 (15.000.000 đ).<br>2. Tiền gửi ngân hàng giảm (Tài sản giảm): Ghi Có TK 112 (15.000.000 đ).",
        tAccounts: [
          { code: "111", name: "Tiền mặt", debit: 15000000, credit: 0 },
          { code: "112", name: "Tiền gửi ngân hàng", debit: 0, credit: 15000000 }
        ]
      },
      {
        id: 3,
        category: "Bán hàng & Doanh thu",
        scenario: "Khách hàng thanh toán nợ kỳ trước cho doanh nghiệp bằng chuyển khoản qua ngân hàng, số tiền 40.000.000 đ (Đã nhận được giấy báo Có).",
        sampleCorrect: [
          { side: "No", account: "112", amount: 40000000 },
          { side: "Co", account: "131", amount: 40000000 }
        ],
        sampleWrong: [
          { side: "No", account: "111", amount: 40000000 },
          { side: "Co", account: "511", amount: 40000000 }
        ],
        correctEntries: [
          { side: "No", account: "112", amount: 40000000 },
          { side: "Co", account: "131", amount: 40000000 }
        ],
        analysis: "1. Tiền gửi ngân hàng tăng lên: Ghi Nợ TK 112 (40.000.000 đ).<br>2. Phải thu khách hàng giảm xuống do khách đã thanh toán: Ghi Có TK 131 (40.000.000 đ).",
        tAccounts: [
          { code: "112", name: "Tiền gửi ngân hàng", debit: 40000000, credit: 0 },
          { code: "131", name: "Phải thu khách hàng", debit: 0, credit: 40000000 }
        ]
      }
    ];

    let currentIndex = 0;

    function loadQuestion(idx) {
      const q = QUESTIONS[idx];
      document.getElementById("scenarioText").innerHTML = q.scenario;
      document.getElementById("badgeCategory").innerText = q.category;
      document.getElementById("qCounter").innerText = `Nghiệp vụ ${idx + 1} / ${QUESTIONS.length}`;
      document.getElementById("feedbackSection").classList.add("hidden");
      
      const container = document.getElementById("entriesContainer");
      container.innerHTML = "";
      // Mặc định tạo 2 dòng trống
      addEntryRow();
      addEntryRow();
      updateTotals();
    }

    function addEntryRow(side = "No", account = "", amount = "") {
      const container = document.getElementById("entriesContainer");
      const rowId = "row_" + Math.random().toString(36).substring(2, 9);
      const accName = ACCOUNT_CHART[account] || "Nhập mã TK (VD: 111, 152)";

      const rowHtml = `
        <div id="${rowId}" class="flex flex-wrap sm:flex-nowrap items-center gap-2 p-2 bg-slate-50 rounded-lg border border-slate-200">
          <select class="side-select bg-white border border-slate-300 rounded px-2.5 py-1.5 font-bold text-sm text-slate-700 outline-none focus:border-indigo-500" onchange="updateTotals()">
            <option value="No" ${side === "No" ? "selected" : ""}>Nợ</option>
            <option value="Co" ${side === "Co" ? "selected" : ""}>Có</option>
          </select>
          <div class="relative w-28">
            <input type="text" placeholder="TK..." value="${account}" 
              class="acc-input w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm font-mono font-bold uppercase focus:border-indigo-500 outline-none"
              oninput="handleAccountInput(this)">
          </div>
          <div class="flex-1 min-w-[140px] text-xs text-slate-500 font-medium truncate acc-name-label">
            ${accName}
          </div>
          <div class="w-36">
            <input type="number" placeholder="Số tiền..." value="${amount}"
              class="amount-input w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm font-mono text-right focus:border-indigo-500 outline-none"
              oninput="updateTotals()">
          </div>
          <button onclick="removeEntryRow('${rowId}')" class="text-slate-400 hover:text-rose-600 p-1.5 rounded transition">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `;
      container.insertAdjacentHTML("beforeend", rowHtml);
      lucide.createIcons();
      updateTotals();
    }

    function removeEntryRow(id) {
      const row = document.getElementById(id);
      if (row) row.remove();
      updateTotals();
    }

    function handleAccountInput(inputElem) {
      const val = inputElem.value.trim();
      const parent = inputElem.closest("div").parentElement;
      const label = parent.querySelector(".acc-name-label");
      if (ACCOUNT_CHART[val]) {
        label.innerText = ACCOUNT_CHART[val];
        label.className = "flex-1 min-w-[140px] text-xs text-indigo-700 font-semibold truncate acc-name-label";
      } else {
        label.innerText = val.length > 0 ? "Chưa nhận diện được mã TK" : "Nhập mã TK (VD: 111, 152)";
        label.className = "flex-1 min-w-[140px] text-xs text-slate-400 font-normal truncate acc-name-label";
      }
    }

    function updateTotals() {
      let debitTotal = 0;
      let creditTotal = 0;
      const rows = document.querySelectorAll("#entriesContainer > div");

      rows.forEach(row => {
        const side = row.querySelector(".side-select").value;
        const amt = parseFloat(row.querySelector(".amount-input").value) || 0;
        if (side === "No") debitTotal += amt;
        if (side === "Co") creditTotal += amt;
      });

      document.getElementById("sumDebit").innerText = debitTotal.toLocaleString("vi-VN") + " đ";
      document.getElementById("sumCredit").innerText = creditTotal.toLocaleString("vi-VN") + " đ";

      const statusElem = document.getElementById("balanceStatus");
      if (debitTotal > 0 && debitTotal === creditTotal) {
        statusElem.innerText = "Cân bằng Nợ = Có";
        statusElem.className = "text-xs font-semibold px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800";
      } else {
        statusElem.innerText = "Chưa cân bằng Nợ - Có";
        statusElem.className = "text-xs font-medium px-2 py-0.5 rounded bg-amber-100 text-amber-800";
      }
    }

    function fillSample(isCorrect) {
      const q = QUESTIONS[currentIndex];
      const data = isCorrect ? q.sampleCorrect : q.sampleWrong;
      const container = document.getElementById("entriesContainer");
      container.innerHTML = "";
      data.forEach(item => {
        addEntryRow(item.side, item.account, item.amount);
      });
      updateTotals();
    }

    function checkAnswer() {
      const q = QUESTIONS[currentIndex];
      const rows = document.querySelectorAll("#entriesContainer > div");
      let userEntries = [];

      rows.forEach(row => {
        userEntries.push({
          side: row.querySelector(".side-select").value,
          account: row.querySelector(".acc-input").value.trim(),
          amount: parseFloat(row.querySelector(".amount-input").value) || 0
        });
      });

      // So sánh kết quả
      let isAllCorrect = true;
      if (userEntries.length !== q.correctEntries.length) {
        isAllCorrect = false;
      } else {
        for (let target of q.correctEntries) {
          const match = userEntries.find(u => u.side === target.side && u.account === target.account && u.amount === target.amount);
          if (!match) {
            isAllCorrect = false;
            break;
          }
        }
      }

      // Hiển thị khung phản hồi
      const feedbackBox = document.getElementById("feedbackSection");
      const headerBox = document.getElementById("feedbackHeader");
      const analysisElem = document.getElementById("analysisText");
      feedbackBox.classList.remove("hidden");

      if (isAllCorrect) {
        feedbackBox.className = "bg-emerald-50/50 rounded-xl shadow-sm border border-emerald-200 p-6 mb-8";
        headerBox.className = "flex items-center space-x-3 mb-4 p-3 rounded-lg bg-emerald-100 text-emerald-900 font-bold";
        headerBox.innerHTML = `<i data-lucide="check-circle-2" class="w-6 h-6 text-emerald-600"></i> <span>Chính xác tuyệt đối! Bạn đã nắm rất vững bản chất đối ứng tài khoản.</span>`;
      } else {
        feedbackBox.className = "bg-rose-50/50 rounded-xl shadow-sm border border-rose-200 p-6 mb-8";
        headerBox.className = "flex items-center space-x-3 mb-4 p-3 rounded-lg bg-rose-100 text-rose-900 font-bold";
        headerBox.innerHTML = `<i data-lucide="alert-circle" class="w-6 h-6 text-rose-600"></i> <span>Định khoản chưa chính xác hoặc chưa khớp số tiền. Hãy quan sát phân tích và sơ đồ chữ T chuẩn dưới đây:</span>`;
      }

      analysisElem.innerHTML = q.analysis;
      renderTAccounts(q.tAccounts);
      lucide.createIcons();
      feedbackBox.scrollIntoView({ behavior: "smooth" });
    }

    function renderTAccounts(accounts) {
      const container = document.getElementById("tAccountsContainer");
      container.innerHTML = "";

      accounts.forEach(acc => {
        const cardHtml = `
          <div class="w-64 bg-white border-2 border-slate-700 rounded shadow-sm overflow-hidden m-2">
            <div class="border-b-2 border-slate-700 p-2 text-center bg-slate-100 font-bold text-slate-900 text-sm">
              TK ${acc.code} - ${acc.name}
            </div>
            <div class="grid grid-cols-2 min-h-[90px] text-sm">
              <div class="border-r-2 border-slate-700 p-2 text-left">
                <span class="block text-[10px] font-bold text-slate-400">NỢ</span>
                ${acc.debit > 0 ? `<span class="font-mono font-bold text-emerald-700">${acc.debit.toLocaleString("vi-VN")}</span>` : ""}
              </div>
              <div class="p-2 text-right">
                <span class="block text-[10px] font-bold text-slate-400">CÓ</span>
                ${acc.credit > 0 ? `<span class="font-mono font-bold text-indigo-700">${acc.credit.toLocaleString("vi-VN")}</span>` : ""}
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML("beforeend", cardHtml);
      });
    }

    function nextQuestion() {
      currentIndex = (currentIndex + 1) % QUESTIONS.length;
      loadQuestion(currentIndex);
    }

    // Khởi chạy khi load trang
    window.onload = () => {
      loadQuestion(0);
      lucide.createIcons();
    };
  </script>
</body>
</html>
